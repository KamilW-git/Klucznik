# CI: docs/architecture/infrastructure.md#ci
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Wersja pnpm z pola `packageManager` w package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Q-23: testy jednostkowe; integracyjne w jobach test-api / test-web.
      - run: pnpm test

  # Migracje uruchamia global-setup testów; kolejka e-maili `inline`, więc bez Redisa (H-002, H-013).
  test-api:
    name: API – testy integracyjne
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klucznik
          POSTGRES_PASSWORD: klucznik-ci
          POSTGRES_DB: klucznik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klucznik -d klucznik_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Z TEST_DATABASE_URL testy nie uruchamiają Testcontainers.
      TEST_DATABASE_URL: postgresql://klucznik:klucznik-ci@localhost:5432/klucznik_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @klucznik/api test:int

  # Q-23: testy Vitest weba (jsdom) biegną w `quality` (`pnpm test`); tu build produkcyjny Vite.
  test-web:
    name: Web – build (M10)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @klucznik/web build

  # Eksport nie wymaga `.env` ani usług (wartości zastępcze w src/config/openapi-export-env.ts).
  contract:
    name: Kontrakt OpenAPI i klient
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @klucznik/api openapi:export
      - name: openapi.json aktualny względem kodu API
        run: git diff --exit-code packages/api-client/openapi.json
      - run: pnpm --filter @klucznik/api-client generate
      - name: wygenerowany klient aktualny względem openapi.json
        run: git diff --exit-code packages/api-client/src/generated
      - run: pnpm --filter @klucznik/web typecheck

  build:
    name: Build i pełny stack Docker
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Na `main`: obrazy z czystego checkoutu i smoke test całego stacku (nginx → api → postgres).
      - name: docker compose up
        if: github.ref == 'refs/heads/main'
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 240
      - name: smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://localhost:8080/api/v1/health
          curl --fail --silent --show-error -o /dev/null http://localhost:8080/o/nieistniejacy-obiekt
      - name: logi kontenerów (po błędzie)
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: docker compose down
        if: always() && github.ref == 'refs/heads/main'
        run: docker compose down --volumes
