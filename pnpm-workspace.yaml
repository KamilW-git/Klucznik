packages:
  - apps/*
  - packages/*

# Wspólne wersje zależności używanych w wielu pakietach (`"typescript": "catalog:"`).
catalog:
  # TS 7 (natywny) nie jest jeszcze wspierany przez typescript-eslint i @nestjs/cli.
  typescript: ~6.0.3

# Skrypty instalacyjne zależności (pnpm 11 przerywa `install`, gdy nie są rozstrzygnięte).
# `false`: build niepotrzebny (gotowe binaria, fallback w JS albo telemetria).
allowBuilds:
  '@parcel/watcher': false # @nestjs/cli (watch), binaria w optionalDependencies
  '@prisma/engines': true # pobiera schema engine używany przez `prisma migrate`
  '@scarf/scarf': false # swagger-ui-dist, telemetria instalacji
  argon2: false # gotowe binaria w paczce (prebuilds/), ładowane przez node-gyp-build
  cpu-features: false # ssh2 (Testcontainers), opcjonalne przyspieszenie
  esbuild: false # tsx (seed), binaria w optionalDependencies
  prisma: false # preinstall sprawdza tylko wersję Node
  msgpackr-extract: false # BullMQ (msgpackr), natywne przyspieszenie opcjonalne (fallback w JS)
  protobufjs: false # Testcontainers, postinstall bez wpływu na działanie
  ssh2: false # Testcontainers, natywny crypto opcjonalny (fallback w JS)
  unrs-resolver: false # jest-resolve, binaria w optionalDependencies
