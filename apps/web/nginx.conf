# SPA + reverse proxy do API pod jednym originem (docs/architecture/infrastructure.md#kontenery).
# Jeden origin jest wymagany: ciasteczko `kl_refresh` ma `Path=/api/v1/auth` i `SameSite=Strict`.
#
# Uwaga: `add_header` w bloku `location` wyłącza dziedziczenie nagłówków z `server`,
# dlatego nagłówki bezpieczeństwa są powtórzone w obu lokalizacjach statycznych.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Zdjęcia do 10 MB (`UPLOAD_MAX_BYTES`) plus narzut multipart; limit pilnuje też API (413).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Nagłówki odpowiedzi API (helmet) przychodzą z upstreamu.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # API ma `trust proxy = 1`: limity żądań liczone per IP klienta, nie nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Pliki z hashem w nazwie (Vite): długi cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback; index.html bez cache, żeby po wdrożeniu ładował nowe assety.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Wszystkie zasoby (fonty, zdjęcia z /api/v1/files) są z tego samego originu.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
